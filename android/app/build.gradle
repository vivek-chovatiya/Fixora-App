apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * Bundles the icon font into the APK.
 *
 * Without this, every Icon renders as an empty box: the glyph names resolve, the
 * component renders, and nothing fails — the font simply is not on the device.
 * No test can catch it, because the font is a packaging concern rather than a
 * rendering one.
 *
 * Only the family the theme actually uses is bundled. The package ships around
 * twenty, and shipping the rest would add weight for icons the app cannot name.
 * If ICON_SET in src/shared/theme/icons.ts ever changes, change it here too.
 */
// The property name is all lowercase; fonts.gradle reads `project.vectoricons`
// and silently falls back to every font if it is spelled any other way.
project.ext.vectoricons = [
    iconFontNames: ["MaterialCommunityIcons.ttf"]
]

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Shrinks release builds with R8: unused code and resources are removed, and
 * names are obfuscated.
 *
 * On for release since the Phase 1 launch preparation. React Native and every
 * native library in this app ship the keep rules they need inside their own
 * AARs (React Native's keep everything a NativeModule, every `native` method
 * and every @DoNotStrip member; reanimated and worklets add theirs), which is
 * why proguard-rules.pro holds only what is ours. The images the JavaScript
 * bundles are found by name at run time, which the resource shrinker cannot
 * see; React Native's bundle step writes a raw/keep.xml listing every one of
 * them into the generated resources, so they survive. Never add a
 * res/raw/keep.xml of our own: it has the same name and one hides the other.
 *
 * ⚠️ R8 breaks things at run time, not at build time. A green assembleRelease
 * proves nothing about a class reached by reflection or from C++. After any
 * change here, or any new native dependency, install the release APK and run the
 * smoke test in docs/RELEASE.md. Keep each release's
 * build/outputs/mapping/release/mapping.txt — without it a crash report from
 * that build cannot be read.
 */
def enableProguardInReleaseBuilds = true

/**
 * Release signing.
 *
 * The upload key and its passwords never enter this repository. They are read
 * from four Gradle properties kept in the machine-wide
 * ~/.gradle/gradle.properties (docs/RELEASE.md says how to create the key and
 * where to keep it). When all four are present, release builds are signed with
 * the upload key and can go to the Play Store.
 *
 * When any is missing, what happens depends on what is being built:
 *
 * - An App Bundle (`bundleRelease`) is refused, and the build fails before any
 *   task runs, naming the missing properties. An AAB exists only to go to the
 *   Play Store, which rejects one signed with the debug key — after it has been
 *   built and uploaded. Found in review, 21/10/2026: with only a warning, and
 *   `-q` hiding warnings, `bundleRelease -q` produced a debug-signed AAB and said
 *   nothing at all.
 * - An APK (`assembleRelease`) falls back to the debug key, so a minified build
 *   still installs for a smoke test on a machine without the key. Failing here
 *   would stop every developer from ever testing a minified build. It says so
 *   with `logger.error`, the one level `-q` still prints: a warning would vanish
 *   from exactly the quiet build whose output nobody reads twice.
 *
 * ⚠️ Never put these values in android/gradle.properties, local.properties or
 * any other file in the repo, and never hardcode them here. Only the names of
 * missing properties are ever printed, never a value.
 */
def uploadKeyPropertyNames = [
    "FIXORA_UPLOAD_STORE_FILE",
    "FIXORA_UPLOAD_STORE_PASSWORD",
    "FIXORA_UPLOAD_KEY_ALIAS",
    "FIXORA_UPLOAD_KEY_PASSWORD",
]
def missingUploadKeyProperties = uploadKeyPropertyNames.findAll { name ->
    !project.hasProperty(name) || project.property(name).toString().trim().isEmpty()
}
def hasUploadKey = missingUploadKeyProperties.isEmpty()

// Decided only when a signed release artifact is actually being produced, so a
// debug build is not told about a key it does not need.
if (!hasUploadKey) {
    gradle.taskGraph.whenReady { graph ->
        def taskNames = graph.allTasks.findAll { task -> task.project == project }*.name
        def missing = missingUploadKeyProperties.join(', ')

        // The bundle first: a build that asks for both must not get as far as
        // the APK's message and look like it worked.
        if (taskNames.contains("bundleRelease") || taskNames.contains("signReleaseBundle")) {
            throw new GradleException(
                "This Fixora App Bundle cannot be built: the upload key is not configured.\n" +
                "  An App Bundle is only for the Play Store, and one signed with the debug key is rejected there.\n" +
                "  Missing Gradle properties: ${missing}\n" +
                "  Set them in ~/.gradle/gradle.properties, never in this repository (see docs/RELEASE.md).\n" +
                "  To test a release build on a device without the key, build the APK: assembleRelease."
            )
        }

        if (taskNames.contains("packageRelease")) {
            logger.error(
                "\nWARNING: this Fixora release APK is signed with the DEBUG key.\n" +
                "  The Play Store will not accept it. Use it only for testing on a device.\n" +
                "  Missing Gradle properties: ${missing}\n" +
                "  Set them in ~/.gradle/gradle.properties, never in this repository (see docs/RELEASE.md).\n"
            )
        }
    }
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.fixora"
    defaultConfig {
        applicationId "com.fixora"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // ⚠️ Every upload to the Play Store needs a higher versionCode than the
        // last one, or it is rejected. versionName is what users see. The rules
        // are in docs/RELEASE.md.
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Created only when the key is configured, so an incomplete signing
        // config can never be picked up by accident.
        if (hasUploadKey) {
            release {
                storeFile file(project.property("FIXORA_UPLOAD_STORE_FILE"))
                storePassword project.property("FIXORA_UPLOAD_STORE_PASSWORD")
                keyAlias project.property("FIXORA_UPLOAD_KEY_ALIAS")
                keyPassword project.property("FIXORA_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // The upload key when it is configured; otherwise the debug key for an
            // APK (with the message above) and no App Bundle at all. See
            // "Release signing".
            signingConfig hasUploadKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
